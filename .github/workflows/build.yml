name: Build TWRP for Infinix NOTE 12 G96 (X670)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TWRP_DIR: /home/runner/TWRP

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/infinix/X670

      # ── 2. Dependencies (cached via apt) ──────────────────────────────────────
      - name: Cache apt packages
        uses: actions/cache@v4
        id: apt-cache
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-twrp-deps-v1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses-dev lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 \
            python-is-python3 openjdk-11-jdk

      # ── 3. repo tool ──────────────────────────────────────────────────────────
      - name: Set up repo tool
        run: |
          mkdir -p ~/.local/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.local/bin/repo
          chmod a+x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.email "build@github.com"
          git config --global user.name "GitHub Actions"

      # ── 4. TWRP source cache ──────────────────────────────────────────────────
      # Key rotates weekly so you get a fresh sync every 7 days,
      # but on repeated runs within the same week repo sync is a fast
      # incremental update instead of a full 15 GB download.
      - name: Get week number (for cache key rotation)
        id: week
        run: echo "week=$(date +%Y-W%V)" >> $GITHUB_OUTPUT

      - name: Cache TWRP source
        uses: actions/cache@v4
        id: twrp-source-cache
        with:
          path: ${{ env.TWRP_DIR }}
          key: twrp-source-12.1-${{ steps.week.outputs.week }}
          restore-keys: |
            twrp-source-12.1-

      - name: Sync TWRP source
        run: |
          mkdir -p $TWRP_DIR && cd $TWRP_DIR
          # Init only when the .repo directory is absent (cache miss)
          if [ ! -d ".repo" ]; then
            repo init --depth=1 \
              -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
              -b twrp-12.1
          fi
          # Always sync — on a cache hit this is a quick incremental update
          repo sync -j$(nproc) --no-clone-bundle --no-tags --force-sync

      # ── 5. Device tree ────────────────────────────────────────────────────────
      - name: Place device tree
        run: |
          mkdir -p $TWRP_DIR/device/infinix
          cp -r $GITHUB_WORKSPACE/device/infinix/X670 \
                $TWRP_DIR/device/infinix/X670

      # ── 6. Build output cache ─────────────────────────────────────────────────
      # Caches host tools and generated headers so incremental builds skip
      # most of the Java/host-tool compilation on subsequent runs.
      # Keyed on device tree content so a device tree commit busts the cache.
      - name: Hash device tree for cache key
        id: dt-hash
        run: |
          echo "hash=$( find $GITHUB_WORKSPACE/device/infinix/X670 \
            -type f | sort | xargs sha256sum | sha256sum | cut -c1-16 )" \
            >> $GITHUB_OUTPUT

      - name: Cache build output
        uses: actions/cache@v4
        id: out-cache
        with:
          path: ${{ env.TWRP_DIR }}/out
          key: twrp-out-X670-${{ steps.week.outputs.week }}-${{ steps.dt-hash.outputs.hash }}
          restore-keys: |
            twrp-out-X670-${{ steps.week.outputs.week }}-
            twrp-out-X670-

      # ── 7. Build ──────────────────────────────────────────────────────────────
      - name: Build boot.img
        run: |
          cd $TWRP_DIR
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_X670-eng
          mka bootimage -j$(nproc) 2>&1 | tee build.log

      # ── 8. Artifacts ──────────────────────────────────────────────────────────
      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-X670-boot-${{ github.sha }}
          path: ${{ env.TWRP_DIR }}/out/target/product/X670/boot.img
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: ${{ env.TWRP_DIR }}/build.log
